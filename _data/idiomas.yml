  impact_title: Traceable student welfare management
  impact_lead: SGAE brings benefit allocation, POLAE rules and payroll generation
    into a documented workflow.
  impact_before: Before the system
  impact_after: With SGAE
  impact_before_list:
  - Shared spreadsheets and manual checks for conflicting benefits.
  - Manual transcription of banking details prone to errors.
  - Limited traceability between benefit allocation and payment.
  impact_after_list:
  - Rule validation during benefit allocation.
  - Payroll generated from benefit links and payment records.
  - History of approvals, suspensions and cancellations.
  impact_note: Scale of the stakeholder programme; not measured savings. Expansion
    requires institutional assessment and local adaptation.
