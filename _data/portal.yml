factory_steps:
  - step: "01"
    title: "Desafio Real"
    tag: "Entrada"
    date: "Demandante"
    desc: "Problema real trazido por setor público ou órgão de governo com regulamento existente e usuário direto identificado."
  - step: "02"
    title: "Inception & Descoberta"
    tag: "M1"
    date: "26/06"
    desc: "Entrevistas com usuários, personas, jornadas, visão do produto e definição de backlog inicial auditável."
  - step: "03"
    title: "Gate Técnico"
    tag: "Arquitetura"
    date: "03/07"
    desc: "Arquitetura de software, modelagem de dados, pipelines de CI/CD, esteiras de testes e conformidade com LGPD."
  - step: "04"
    title: "Beta Funcional"
    tag: "M2"
    date: "24/07"
    desc: "Ciclos ágeis de desenvolvimento em squads com entregas semanais integradas e homologação com usuários."
  - step: "05"
    title: "Entrega Validada"
    tag: "M3"
    date: "07/08"
    desc: "Sistema completo testado, documentação técnica, manuais de operação e apresentação no Demo Day."
  - step: "06"
    title: "Homologação"
    tag: "Produção"
    date: "14/08"
    desc: "Deploy em infraestrutura oficial do IFPI e homologação formal direta com os gestores dos setores atendidos."
  - step: "07"
    title: "Transferência Formal"
    tag: "Marco 11/09"
    date: "11/09"
    desc: "Entrega com mantenedor nomeado, runbook de sustentação, rollback testado e termo formal de transferência assinado."
  - step: "08"
    title: "Evolução Contínua"
    tag: "Fase 2"
    date: "Sprints"
    desc: "Sprints quinzenais de evolução contínua guiadas pelas prioridades dos setores que operam os sistemas em produção."

