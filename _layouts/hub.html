<!doctype html>
<html lang="{% if page.lang == 'en' %}en{% else %}pt-BR{% endif %}">
  <head>
    {% include head.html %}
  </head>
  <body class="hub-body">
    {% assign lang = page.lang | default: 'pt' %}
    {% assign ui = site.data.idiomas[lang] %}
    <a class="skip-link" href="#conteudo">{{ ui.skip }}</a>

    {% include hub-header.html %}

    <!-- Conteúdo Central -->
    <main id="conteudo" class="hub-main" role="main">
      {{ content }}
    </main>

    {% include hub-footer.html %}
  </body>
</html>
